<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Material Biodegradable</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(to right, #d4fc79, #96e6a1);
    transition:0.4s;
}

header{
    background:#14532d;
    color:white;
    text-align:center;
    padding:30px;
}

nav{
    background:#166534;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    text-decoration:underline;
}

section{
    background:white;
    margin:150px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    animation:fadeIn 1s ease-in-out;
}

h2{
    color:#166534;
    margin-bottom:15px;
}

p{
    margin-bottom:15px;
    text-align:justify;
}

/* CONTENEDOR PARA IMAGEN Y TEXTO */
.contenedor{
    display:flex;
    align-items:center;
    gap:25px;
    margin-bottom:25px;
}

.contenedor img{
    width:300px;
    border-radius:25px;
}

.contenedor p{
    flex:1;
}

button{
    padding:10px 15px;
    border:none;
    background:#166534;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#14532d;
}

footer{
    background:#14532d;
    color:white;
    text-align:center;
    padding:20px;
}

/* Animación */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* Modo oscuro */
.dark{
    background:#1a1a1a;
    color:white;
}

.dark section{
    background:#2c2c2c;
    color:white;
}

.dark nav{
    background:#111;
}

.dark header, .dark footer{
    background:#111;
}

/* Celular */
@media(max-width:768px){
    section{
        margin:15px;
    }

    .contenedor{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>
<h1>Desarrollo de Material Protector Biodegradable Polnito</h1>
<p>Proyecto basado en fibras naturales de luffa</p>
<br>
<button onclick="modoOscuro()">🌙 Modo Oscuro</button>
</header>

<nav>
<a href="#intro">Introducción</a>
<a href="#justi">Justificación</a>
<a href="#pepe">OBJETIVOS</a>

</nav>

<section id="intro">
<h2>INTRODUCCIÓN</h2>


</section>

<section id="justi">
<h2>JUSTIFICACIÓN</h2>

</section>

<section id="pepe">
<h2>OBJETIVOS</h2>



</section>

<footer>
Proyecto Escolar 2026 | Alternativa Ecológica con Luffa
</footer>

<script>
function modoOscuro(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
